name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep all Gradle state in the workspace; no user-wide init scripts apply.
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci-gradle

    steps:
      # Official v7.0.1 release, resolved to an immutable commit.
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run bounded repository checks
        run: |
          python3 tools/check-repository.py --self-test
          python3 tools/check-repository.py

      # Official v6.0.0 release, resolved to an immutable commit.
      # https://github.com/actions/setup-java/releases/tag/v6.0.0
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      # Official v4.0.1 release, resolved to an immutable commit.
      # https://github.com/android-actions/setup-android/releases/tag/v4.0.1
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          timeout 900 sdkmanager --install \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-37.0;google_apis_ps16k;x86_64'

      # Official v6.1.0 release, resolved to an immutable commit. Only the
      # wrapper and dependency file stores are cached; project build outputs
      # and broad user-home paths are intentionally excluded.
      # https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Cache bounded Gradle inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ci-gradle/wrapper/dists
            .ci-gradle/caches/modules-2/files-2.1
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle', '**/*.gradle.kts') }}

      - name: Verify toolchain
        run: |
          timeout 15 java -version
          timeout 30 sdkmanager --version
          timeout 180 ./gradlew --version

      - name: Run JVM tests, APK builds, and Android lint
        run: >-
          timeout 1500 ./gradlew --no-daemon --max-workers=1 --console plain
          :core:test
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:assembleRelease
          :app:lintDebug
          :app:lintRelease
          :extractor:assembleDebugAndroidTest
          :extractor:lintDebug
          :extractor:lintRelease

      - name: Run fixture instrumentation on Android 37 with 16 KB pages
        shell: bash
        run: |
          set -euo pipefail
          # Grant this ephemeral runner user access to KVM, only if needed.
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$USER:rw" /dev/kvm
          fi
          printf 'no\n' | timeout 60 avdmanager create avd \
            --name sourcescribe-ci \
            --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          timeout 1200 "$ANDROID_HOME/emulator/emulator" \
            -avd sourcescribe-ci -no-window -no-audio -no-snapshot \
            -gpu software -accel on -memory 2048 -cores 2 -no-boot-anim \
            > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'timeout 15 adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          timeout 25 adb -s emulator-5554 shell input keyevent 82
          timeout 25 adb -s emulator-5554 shell getprop ro.build.fingerprint
          [[ "$(timeout 25 adb -s emulator-5554 shell getconf PAGE_SIZE | tr -d '\r')" == 16384 ]]
          timeout 900 ./gradlew --no-daemon --max-workers=1 --console plain \
            -Pandroid.testInstrumentationRunnerArguments.sourcescribeEngineUpdate=true \
            :app:connectedDebugAndroidTest :extractor:connectedDebugAndroidTest
